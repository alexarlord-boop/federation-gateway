ui:
  public_base_url: http://localhost:8080
backend:
  public_base_url: http://localhost:8765
instances:
  - id: ta-1
    name: LightHouse
    public_base_url: http://localhost:8081
    admin_base_url: http://lighthouse:8080
    public_port: 8081
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE_ADMIN_USERNAME
      password_env: LIGHTHOUSE_ADMIN_PASSWORD
  - id: ta-2
    name: LightHouse 2
    public_base_url: http://localhost:8082
    admin_base_url: http://lighthouse2:8080
    public_port: 8082
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE_ADMIN_USERNAME
      password_env: LIGHTHOUSE_ADMIN_PASSWORD
  # Small mesh — a real multi-hop federation (see docker-compose.yml and
  # scripts/seed-mesh.py). Only the nodes that manage their own
  # subordinates (mesh-ta, mesh-ia, mesh-ia2) are registered here; the
  # leaves (mesh-leaf-op, mesh-leaf-rp, mesh-leaf-multi) are administered
  # from their parent(s)' own Subordinates/Trust Marks pages, same as any
  # other subordinate entity. mesh-leaf-multi has two parents (mesh-ia AND
  # mesh-ia2 — see scripts/seed-mesh.py), so it shows up under both.
  - id: mesh-ta
    name: Mesh - Trust Anchor
    public_base_url: http://localhost:8090
    admin_base_url: http://mesh-ta:8080
    public_port: 8090
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE_ADMIN_USERNAME
      password_env: LIGHTHOUSE_ADMIN_PASSWORD
  - id: mesh-ia
    name: Mesh - Intermediate
    public_base_url: http://localhost:8091
    admin_base_url: http://mesh-ia:8080
    public_port: 8091
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE_ADMIN_USERNAME
      password_env: LIGHTHOUSE_ADMIN_PASSWORD
  - id: mesh-ia2
    name: Mesh - Intermediate 2
    public_base_url: http://localhost:8097
    admin_base_url: http://mesh-ia2:8080
    public_port: 8097
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE_ADMIN_USERNAME
      password_env: LIGHTHOUSE_ADMIN_PASSWORD
  # mesh2 — a second, fully independent hierarchy (no shared root, and no
  # shared docker network — see docker-compose.yml's mesh2net) for
  # interfederation testing. Same registration pattern: only mesh2-ta/
  # mesh2-ia manage subordinates, so only those two are registered here.
  # Distinct admin credentials (LIGHTHOUSE2_*) from the rest of the
  # deployment, matching how a real separate federation would be run —
  # `backend` is on both networks so it can still reach mesh2-ta directly.
  - id: mesh2-ta
    name: Mesh2 - Trust Anchor
    public_base_url: http://localhost:8094
    admin_base_url: http://mesh2-ta:8080
    public_port: 8094
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE2_ADMIN_USERNAME
      password_env: LIGHTHOUSE2_ADMIN_PASSWORD
  - id: mesh2-ia
    name: Mesh2 - Intermediate
    public_base_url: http://localhost:8095
    admin_base_url: http://mesh2-ia:8080
    public_port: 8095
    admin_port: 8080
    admin_auth:
      type: basic
      username_env: LIGHTHOUSE2_ADMIN_USERNAME
      password_env: LIGHTHOUSE2_ADMIN_PASSWORD
