# LightHouse configuration — mesh2 Intermediate Authority (subordinate of mesh2-ta).
entity_id: "http://mesh2-ia:8080"

server:
  port: 8080

storage:
  driver: sqlite
  data_dir: /data

signing:
  kms: filesystem
  auto_generate_keys: true
  filesystem:
    key_dir: /data/keys

api:
  admin:
    enabled: true
    users_enabled: false
    actor_source: "header"
    actor_header: "X-Gateway-User-Email"

endpoints:
  fetch:
    path: /fetch
  list:
    path: /list
  resolve:
    path: /resolve
  trust_mark:
    path: /trust_mark
  trust_mark_status:
    path: /trust_mark/status
  trust_mark_list:
    path: /trust_mark/list

stats:
  enabled: true
