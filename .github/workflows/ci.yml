name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: cd backend && pip install -r requirements.txt
      - name: Run pytest
        run: cd backend && pytest

  client-freshness:
    name: Generated API client is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run verify:client

  e2e-bff:
    name: BFF-only E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: playwright-chromium-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate .env
        # docker compose up fails closed without one (PRODUCTION-READINESS.md
        # #5/#2) — cryptography is the only non-stdlib dep generate-secrets.py needs.
        run: pip install -q cryptography && python3 scripts/generate-secrets.py
      - name: Start full stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 120
      - name: Install e2e deps
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run BFF tests
        run: cd e2e && npx playwright test --project=bff-only
        env:
          APP_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-bff
          path: e2e/playwright-report/
          retention-days: 7

  e2e-full:
    name: Full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: playwright-chromium-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate .env
        # docker compose up fails closed without one (PRODUCTION-READINESS.md
        # #5/#2) — cryptography is the only non-stdlib dep generate-secrets.py needs.
        run: pip install -q cryptography && python3 scripts/generate-secrets.py
      - name: Start full stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 120
      - name: Install e2e deps
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run proxy tests
        run: cd e2e && npx playwright test --project=full-stack
        env:
          APP_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full
          path: e2e/playwright-report/
          retention-days: 7
