# LightHouse configuration — mesh root Trust Anchor.
#
# entity_id uses the docker-network hostname (not localhost) so other
# LightHouse containers in the mesh can actually fetch this node's entity
# configuration when walking trust chains. See docker-compose.yml for the
# published host port used to browse this node directly.
entity_id: "http://mesh-ta:8080"

server:
  port: 8080

storage:
  driver: sqlite
  data_dir: /data

signing:
  kms: filesystem
  auto_generate_keys: true
  filesystem:
    key_dir: /data/keys

api:
  admin:
    enabled: true
    users_enabled: false
    actor_source: "header"
    actor_header: "X-Gateway-User-Email"

endpoints:
  fetch:
    path: /fetch
  list:
    path: /list
  resolve:
    path: /resolve
  trust_mark:
    path: /trust_mark
  trust_mark_status:
    path: /trust_mark/status
  trust_mark_list:
    path: /trust_mark/list

stats:
  enabled: true
