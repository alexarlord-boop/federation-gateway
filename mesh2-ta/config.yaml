# LightHouse configuration — mesh2 root Trust Anchor.
#
# mesh2 is a second, fully independent hierarchy (no shared root, no
# authority_hint path) from the mesh-* federation — used to test genuine
# interfederation scenarios: a mesh-* issuer marking a mesh2 entity, and
# confirming chain resolution correctly fails across the two roots. See
# docs/FEDERATION-TOPOLOGY.md.
entity_id: "http://mesh2-ta:8080"

server:
  port: 8080

storage:
  driver: sqlite
  data_dir: /data

signing:
  kms: filesystem
  auto_generate_keys: true
  filesystem:
    key_dir: /data/keys

api:
  admin:
    enabled: true
    users_enabled: false
    actor_source: "header"
    actor_header: "X-Gateway-User-Email"

endpoints:
  fetch:
    path: /fetch
  list:
    path: /list
  resolve:
    path: /resolve
  trust_mark:
    path: /trust_mark
  trust_mark_status:
    path: /trust_mark/status
  trust_mark_list:
    path: /trust_mark/list

stats:
  enabled: true
