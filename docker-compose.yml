services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GATEWAY_CONFIG_FILE: /config/gateway.yaml
      LIGHTHOUSE_ADMIN_USERNAME: ${LIGHTHOUSE_ADMIN_USERNAME:-gateway}
      LIGHTHOUSE_ADMIN_PASSWORD: ${LIGHTHOUSE_ADMIN_PASSWORD:-gateway}
      # Distinct credentials for mesh2 — a real separate federation would
      # never share admin credentials with this one, even though LightHouse
      # itself doesn't enforce them yet (api.admin.users_enabled: false in
      # every config.yaml here). Only the backend reads these; LightHouse
      # containers never receive them as env vars.
      LIGHTHOUSE2_ADMIN_USERNAME: ${LIGHTHOUSE2_ADMIN_USERNAME:-gateway2}
      LIGHTHOUSE2_ADMIN_PASSWORD: ${LIGHTHOUSE2_ADMIN_PASSWORD:-gateway2}
      # Without this, backend.db lives in the container's writable layer and
      # is silently wiped on every rebuild — users, RBAC roles, and the audit
      # log all reset with no warning.
      DATABASE_URL: sqlite:////data/backend.db
    volumes:
      - ./backend/config:/config:ro
      - ./backend/data:/data
    ports:
      - "${BACKEND_PORT:-8765}:8765"
    networks:
      - default
      - mesh2net
    depends_on:
      lighthouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  ui:
    build:
      context: .
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  lighthouse:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${LIGHTHOUSE_PUBLIC_PORT:-8081}:8080"
    volumes:
      - ./lighthouse/config.yaml:/config/config.yaml:ro
      - ./lighthouse/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    # LightHouse's image ships no curl/wget/nc — bash's /dev/tcp is the only
    # HTTP-capable tool available inside the container.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Second LightHouse instance — serves as a second federation Trust Anchor on port 8082.
  lighthouse2:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${LIGHTHOUSE2_PUBLIC_PORT:-8082}:8080"
    volumes:
      - ./lighthouse2/config.yaml:/config/config.yaml:ro
      - ./lighthouse2/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ── Small LightHouse mesh: a real multi-hop federation for testing trust
  # chain resolution and trust mark issuance end-to-end, independent of the
  # standalone lighthouse/lighthouse2 pair above.
  #
  #   mesh-ta (root TA) -> mesh-ia (Intermediate) -> mesh-leaf-op (Subject)
  #                                                -> mesh-leaf-rp (verifier)
  #
  # entity_id on each of these uses the docker-network hostname (not
  # localhost) so the containers can actually fetch each other's entity
  # configurations when walking a chain. See scripts/seed-mesh.py to wire
  # subordinate/authority-hint/trust-mark relationships between them.
  mesh-ta:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH_TA_PUBLIC_PORT:-8090}:8080"
    volumes:
      - ./mesh-ta/config.yaml:/config/config.yaml:ro
      - ./mesh-ta/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mesh-ia:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH_IA_PUBLIC_PORT:-8091}:8080"
    volumes:
      - ./mesh-ia/config.yaml:/config/config.yaml:ro
      - ./mesh-ia/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mesh-leaf-op:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH_LEAF_OP_PUBLIC_PORT:-8092}:8080"
    volumes:
      - ./mesh-leaf-op/config.yaml:/config/config.yaml:ro
      - ./mesh-leaf-op/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mesh-leaf-rp:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH_LEAF_RP_PUBLIC_PORT:-8093}:8080"
    volumes:
      - ./mesh-leaf-rp/config.yaml:/config/config.yaml:ro
      - ./mesh-leaf-rp/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ── mesh2: a second, fully independent hierarchy — no shared root, no
  # authority_hint path to the mesh above, and (unlike mesh1) no shared
  # docker network either: mesh2-* only join mesh2net, so the only way
  # mesh-* and mesh2-* can reach each other at all is via host-published
  # ports (host.docker.internal), the same kind of path two genuinely
  # separate, independently-operated federations would use. `backend` is
  # the one deliberate exception — it joins both networks, since this app
  # administers both federations from one place.
  #
  # Exists to test interfederation scenarios: mesh-ia (the *other* mesh's
  # issuer) marking a mesh2 entity, and confirming trust-chain resolution
  # correctly fails across the two roots (trust marks are issuer-authoritative
  # and don't need a chain; /resolve does). See scripts/seed-mesh2.py and
  # docs/FEDERATION-TOPOLOGY.md.
  mesh2-ta:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH2_TA_PUBLIC_PORT:-8094}:8080"
    volumes:
      - ./mesh2-ta/config.yaml:/config/config.yaml:ro
      - ./mesh2-ta/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    networks:
      - mesh2net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mesh2-ia:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH2_IA_PUBLIC_PORT:-8095}:8080"
    volumes:
      - ./mesh2-ia/config.yaml:/config/config.yaml:ro
      - ./mesh2-ia/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    networks:
      - mesh2net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mesh2-leaf-op:
    image: oidfed/lighthouse@sha256:f03d85e86dda38837afec839535a9e1ebbfdab9cd03ec73c53097dbd6aaad223
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/keys && chmod 0777 /data /data/keys && exec /entrypoint.sh
    ports:
      - "${MESH2_LEAF_OP_PUBLIC_PORT:-8096}:8080"
    volumes:
      - ./mesh2-leaf-op/config.yaml:/config/config.yaml:ro
      - ./mesh2-leaf-op/data:/data
    environment:
      LH_CONFIG_FILE: "/config/config.yaml"
    networks:
      - mesh2net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /.well-known/openid-federation HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default: {}
  # Isolated from `default` — mesh2-* only join this network. `backend`
  # joins both (see comment above the mesh2 services). This is what makes
  # the interfederation simulation real: mesh-* and mesh2-* have no shared
  # docker network, only host-published ports connect them, same as two
  # genuinely independent deployments.
  mesh2net: {}
