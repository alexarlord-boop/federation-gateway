# LightHouse configuration — mesh leaf Relying Party (subordinate of mesh-ia).
# Used from Chain Inspector as the entity resolving/verifying mesh-leaf-op's chain and trust mark.
entity_id: "http://mesh-leaf-rp:8080"

server:
  port: 8080

storage:
  driver: sqlite
  data_dir: /data

signing:
  kms: filesystem
  auto_generate_keys: true
  filesystem:
    key_dir: /data/keys

api:
  admin:
    enabled: true
    users_enabled: false
    actor_source: "header"
    actor_header: "X-Gateway-User-Email"

endpoints:
  fetch:
    path: /fetch
  list:
    path: /list
  resolve:
    path: /resolve
  trust_mark:
    path: /trust_mark
  trust_mark_status:
    path: /trust_mark/status
  trust_mark_list:
    path: /trust_mark/list

stats:
  enabled: true
