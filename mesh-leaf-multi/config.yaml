# LightHouse configuration — mesh leaf registered under BOTH mesh-ia and
# mesh-ia2 (two authority_hints, two independent parents). Exists purely
# for §10.3 (choosing among multiple valid trust chains) and "entity with
# redundant/multiple parents" testing — see scripts/seed-mesh.py for how
# both subordinate registrations + both authority_hints get wired.
entity_id: "http://mesh-leaf-multi:8080"

server:
  port: 8080

storage:
  driver: sqlite
  data_dir: /data

signing:
  kms: filesystem
  auto_generate_keys: true
  filesystem:
    key_dir: /data/keys

api:
  admin:
    enabled: true
    users_enabled: false
    actor_source: "header"
    actor_header: "X-Gateway-User-Email"

endpoints:
  fetch:
    path: /fetch
  list:
    path: /list
  resolve:
    path: /resolve
  trust_mark:
    path: /trust_mark
  trust_mark_status:
    path: /trust_mark/status
  trust_mark_list:
    path: /trust_mark/list
  historical_keys:
    path: /historical_keys

stats:
  enabled: true
